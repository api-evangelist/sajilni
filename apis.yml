name: Sajilni
description: Sajilni is a Middle East / MENA event ticketing and event-management platform
  built for organizers who care about data and branding. Organizers use it to create events,
  design branded registration pages, sell and scan tickets, manage seating and booths, run
  promo/discount codes, collect payments, and analyze attendee data. The consumer-facing site
  is sajilni.com with an organizer/business portal at business.sajilni.com; the platform is a
  Java/Spring web application with an internal authentication service at auth.sajilni.com. As of
  this enrichment pass Sajilni publishes no public API, developer portal, OpenAPI, or webhook
  surface, so this profile captures the company identity, commercial pages, and a live
  domain-security probe rather than API artifacts.
